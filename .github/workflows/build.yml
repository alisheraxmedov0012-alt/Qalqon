name: Build Android APK

on:
  push:
    branches: [ "main", "feature/phase4-screen-time-complete" ]
  pull_request:
  workflow_dispatch:

# Least privilege: checkout + artifact upload need nothing more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Phase 13: run the JVM unit tests explicitly instead of relying on the
    # temporary `assembleDebug -> testDebugUnitTest` bridge in app/build.gradle.kts,
    # so a test failure is its own step rather than hidden inside the assembly graph.
    - name: Run JVM unit tests
      run: ./gradlew :app:testDebugUnitTest --no-daemon

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --no-daemon

    # Block 3 device-test prep: publish the debug APK as a downloadable artifact so it
    # can be installed on a physical device. `if-no-files-found: error` makes a missing
    # APK a red build instead of a silent skip, so this run can never be green without
    # producing the exact artifact that is handed to device testing. Nothing sensitive is
    # uploaded — only the debug APK file (never local.properties, .git or the workspace).
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: qalqon-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30

  # Instrumented (Android) tests on a real emulator.
  # `assembleDebugAndroidTest` only proves the test sources compile; this job is
  # what actually executes FaceGuardMigrationTest, ChildAppPolicyDaoTest and
  # ChildAppPolicyRepositoryTest on a device.
  instrumented-tests:
    name: Instrumented tests (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    # Required for the emulator's hardware acceleration on ubuntu runners.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@v2.38.0
      with:
        api-level: 35
        target: default
        arch: x86_64
        ram-size: 2048M
        disk-size: 4G
        disable-animations: true
        # CI-only stability: `-no-snapshot` is the action's own default (the previous
        # override dropped it), so the emulator never loads or saves an AVD snapshot on
        # the shared runner. Snapshot state is a documented source of non-deterministic
        # stalls, and the action README's snapshot-caching example uses this exact option
        # string *only* for the snapshot-generating step, adding `-no-snapshot-save` for
        # the step that actually runs tests. GPU stays on the recommended software
        # renderer (`swiftshader_indirect`).
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
        script: |
          adb devices
          ./gradlew :app:connectedDebugAndroidTest --stacktrace

    # Keep the reports even when tests fail, so a failure can be diagnosed.
    - name: Upload instrumented test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-test-reports
        path: |
          app/build/reports/androidTests
          app/build/outputs/androidTest-results
          app/build/outputs/logs
        if-no-files-found: ignore
        retention-days: 14

  # Production release signing.
  #
  # Deliberately separate from the pull-request/push jobs above and gated to a tag
  # push or a manual run, so ordinary CI never needs the signing secrets and fork
  # PRs (which cannot read secrets) are unaffected.
  #
  # The signing identity is supplied entirely through repository secrets — no key,
  # password or alias is ever stored in this file or in the repository. Required
  # secrets (configure them in Settings > Secrets and variables > Actions):
  #   QALQON_KEYSTORE_BASE64    base64 of the release .p12/.jks keystore
  #   QALQON_KEYSTORE_PASSWORD  keystore password
  #   QALQON_KEY_ALIAS          key alias
  #   QALQON_KEY_PASSWORD       key password
  # Until they exist the job is a no-op (it warns and skips) rather than a red build.
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Check release signing secrets
      id: signing
      env:
        KEYSTORE_BASE64: ${{ secrets.QALQON_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Release signing secrets are not configured; skipping the signed release build."
        fi

    - name: Decode release keystore
      if: steps.signing.outputs.available == 'true'
      env:
        KEYSTORE_BASE64: ${{ secrets.QALQON_KEYSTORE_BASE64 }}
      run: |
        mkdir -p "$RUNNER_TEMP/signing"
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/qalqon-release.p12"
        chmod 600 "$RUNNER_TEMP/signing/qalqon-release.p12"

    - name: Build signed release APK
      if: steps.signing.outputs.available == 'true'
      env:
        QALQON_RELEASE_STORE_FILE: ${{ runner.temp }}/signing/qalqon-release.p12
        QALQON_RELEASE_STORE_PASSWORD: ${{ secrets.QALQON_KEYSTORE_PASSWORD }}
        QALQON_RELEASE_KEY_ALIAS: ${{ secrets.QALQON_KEY_ALIAS }}
        QALQON_RELEASE_KEY_PASSWORD: ${{ secrets.QALQON_KEY_PASSWORD }}
      run: ./gradlew :app:assembleRelease --no-daemon

    - name: Upload signed release APK
      if: steps.signing.outputs.available == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
        retention-days: 30
