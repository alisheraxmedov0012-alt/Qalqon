name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Least privilege: checkout + artifact upload need nothing more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

  # Instrumented (Android) tests on a real emulator.
  # `assembleDebugAndroidTest` only proves the test sources compile; this job is
  # what actually executes FaceGuardMigrationTest, ChildAppPolicyDaoTest and
  # ChildAppPolicyRepositoryTest on a device.
  instrumented-tests:
    name: Instrumented tests (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    # Required for the emulator's hardware acceleration on ubuntu runners.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@v2.38.0
      with:
        api-level: 35
        target: default
        arch: x86_64
        ram-size: 2048M
        disk-size: 4G
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        script: |
          adb devices
          ./gradlew :app:connectedDebugAndroidTest --stacktrace

    # Keep the reports even when tests fail, so a failure can be diagnosed.
    - name: Upload instrumented test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-test-reports
        path: |
          app/build/reports/androidTests
          app/build/outputs/androidTest-results
          app/build/outputs/logs
        if-no-files-found: ignore
        retention-days: 14
        
